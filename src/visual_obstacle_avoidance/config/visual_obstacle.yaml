/visual_obstacle_node:
  ros__parameters:
    detections_topic: /vision/detections
    camera_info_topic: /camera/camera_info
    debug_image_topic: /vision/debug_image
    obstacles_topic: /vision/obstacles
    obstacle_debug_image_topic: /vision/obstacle_debug_image
    status_topic: /vision/status

    detection_reliability: reliable
    qos_depth: 10
    required_consecutive_frames: 2
    input_timeout_s: 1.0
    diagnostic_timeout_s: 3.0
    status_period_s: 1.0

    min_score: 0.5
    roi_x_min: 0.25
    roi_x_max: 0.75
    roi_y_min: 0.35
    roi_y_max: 1.0
    min_bbox_area_ratio: 0.005
    target_classes: ["person", "bicycle", "car", "motorcycle", "bus", "truck"]
