# Expected interfaces of the vision subsystem.
#
# Formal entry (dmu_vision_bringup/vision.launch.py) exposes stable /vision/*
# topics. The upstream yolo_bringup launch remains available and keeps the
# legacy /yolo/cam0/* names shown at the end of this file.

camera:
  image: /camera/image_raw
  camera_info: /camera/camera_info
  image_rect: /camera/image_rect          # silent until a valid calibration exists

status: /vision/status

yolo:
  detections: /vision/detections
  tracking: /vision/tracks
  debug_image: /vision/debug_image
  debug_bb_markers: /vision/debug_bb_markers
  debug_kp_markers: /vision/debug_kp_markers

obstacle:
  obstacles: /vision/obstacles
  debug_image: /vision/obstacle_debug_image

legacy_yolo:
  detections: /yolo/cam0/detections
  tracking: /yolo/cam0/tracking
  debug_image: /yolo/cam0/debug_image
  debug_bb_markers: /yolo/cam0/debug_bb_markers
  debug_kp_markers: /yolo/cam0/debug_kp_markers
